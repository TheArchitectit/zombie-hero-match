<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>RJL's Zombie Hero Match</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a14;font-family:'Courier New',monospace;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;color:#fff}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
/* HUD */
#hud{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:#12122a;border-bottom:2px solid #2a2a4a;font-size:13px}
#hud .hpwrap{flex:1;max-width:120px}
#hpbar{height:14px;background:#3a1020;border:2px solid #000;border-radius:7px;overflow:hidden}
#hpfill{height:100%;background:linear-gradient(#ff6b6b,#c0392b);width:100%;transition:width .3s}
#hud .stat{padding:0 4px;white-space:nowrap}
#hud b{font-size:15px}
#hud .heroStat{display:flex;align-items:center;gap:3px}
#uhero{font-size:17px}
#xpbar{width:30px;height:7px;background:#1a1a2e;border:1px solid #445;border-radius:4px;overflow:hidden}
#xpfill{display:block;height:100%;width:0;background:linear-gradient(#9df,#48c);transition:width .3s}
/* Battlefield */
#field{position:relative;background:linear-gradient(#141428,#0d0d1c);border-bottom:3px solid #2a2a4a;overflow:hidden;transition:box-shadow .3s}
#field.frosty{box-shadow:inset 0 0 70px rgba(120,200,255,.6)}
#barricade{position:absolute;left:0;top:0;bottom:0;width:10px;background:repeating-linear-gradient(45deg,#8a6a2a,#8a6a2a 6px,#6a4a1a 6px,#6a4a1a 12px);box-shadow:2px 0 8px rgba(0,0,0,.6);z-index:5}
.lanebg{position:absolute;left:0;right:0;border-bottom:1px solid rgba(255,255,255,.05)}
.zombie{position:absolute;left:0;top:0;will-change:transform;text-align:center;z-index:3;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7))}
.zombie .zem{display:block;line-height:1;transform:scaleX(-1)}
.zombie .zhp{height:5px;background:#300;border-radius:3px;margin-top:2px;overflow:hidden;border:1px solid #000}
.zombie .zhp i{display:block;height:100%;background:#4f4;transition:width .15s}
.zombie.slow .zem{filter:drop-shadow(0 0 6px #6cf)}
.zombie.armored .zem{filter:drop-shadow(0 0 4px #aaa)}
.zombie.brute .zem{filter:drop-shadow(0 0 8px #b6f)}
.zombie.boss .zem{filter:drop-shadow(0 0 14px #f33)}
.zombie.boss .zhp{height:8px}
.zombie.dying{transition:opacity .35s,transform .35s;opacity:0}
/* Hero */
#hero{position:absolute;left:14px;top:50%;margin-top:-24px;font-size:42px;line-height:1;z-index:6;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.75));animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
#hero.atk{animation:atk .3s ease}
@keyframes atk{0%{transform:translateX(0)}40%{transform:translateX(16px) scale(1.18)}100%{transform:translateX(0)}}
#hero.lvlup{animation:lvl .9s ease}
@keyframes lvl{0%,100%{filter:drop-shadow(0 0 4px #ffd24a)}50%{filter:drop-shadow(0 0 20px #ffd24a)}}
.proj{position:absolute;left:0;top:0;z-index:9;font-size:20px;line-height:1;pointer-events:none;will-change:transform;filter:drop-shadow(0 0 5px rgba(255,240,160,.9))}
.boom{position:absolute;z-index:9;font-size:26px;line-height:1;pointer-events:none;animation:pop .28s forwards}
@keyframes pop{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.5);opacity:0}}
#abBtn{position:absolute;left:12px;bottom:8px;z-index:8;width:58px;height:58px;border-radius:50%;background:#22244a;border:3px solid #6a6aca;color:#fff;font-family:inherit;font-size:22px;display:none;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;touch-action:manipulation;box-shadow:0 0 12px rgba(90,90,220,.5)}
#abBtn small{font-size:9px;display:block;letter-spacing:.5px}
#abBtn.cd{opacity:.55;border-color:#4a4a6a;box-shadow:none}
/* Grid */
#gridwrap{flex:1;display:flex;align-items:center;justify-content:center;background:#0a0a14}
#grid{position:relative;touch-action:none}
.tile{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:9px;border:2px solid rgba(0,0,0,.55);box-shadow:inset 0 -4px 0 rgba(0,0,0,.3),inset 0 3px 0 rgba(255,255,255,.15);transition:transform .18s ease,opacity .18s;cursor:pointer;will-change:transform;touch-action:none}
.tile.sel{outline:3px solid #fff;outline-offset:-3px;z-index:4}
.tile.pop{opacity:0;transform:scale(.2)!important}
.tile.noswap{animation:nosw .24s}
@keyframes nosw{0%,100%{filter:none}50%{filter:brightness(1.9) saturate(.2)}}
/* Weather */
#weather{position:absolute;inset:0;pointer-events:none;z-index:7;overflow:hidden;opacity:0;transition:opacity .5s}
#weather.on{opacity:1}
#weather .wl{position:absolute;inset:0}
#weather.rain{background:rgba(20,30,60,.18)}
#weather.rain .w1,#weather.storm .w1{background:repeating-linear-gradient(100deg,transparent 0 10px,rgba(170,200,240,.30) 10px 11px,transparent 11px 26px);animation:wRain .55s linear infinite}
#weather.rain .w2,#weather.storm .w2{background:repeating-linear-gradient(100deg,transparent 0 16px,rgba(150,180,220,.18) 16px 17px,transparent 17px 40px);animation:wRain2 .9s linear infinite}
#weather.storm{background:rgba(10,14,40,.32)}
@keyframes wRain{from{background-position:0 0}to{background-position:-4.5px 25.6px}}
@keyframes wRain2{from{background-position:0 0}to{background-position:-6.9px 39.4px}}
#weather.snow{background:rgba(40,50,80,.15)}
#weather.snow .w1{background-image:radial-gradient(rgba(255,255,255,.9) 1.6px,transparent 2.1px);background-size:90px 90px;animation:wSnow 6s linear infinite}
#weather.snow .w2{background-image:radial-gradient(rgba(255,255,255,.55) 1.2px,transparent 1.7px);background-size:70px 70px;animation:wSnow2 4.2s linear infinite}
@keyframes wSnow{from{background-position:0 -90px}to{background-position:0 0}}
@keyframes wSnow2{from{background-position:35px -50px}to{background-position:35px 20px}}
#weather.fog{background:rgba(90,100,120,.10)}
#weather.fog .w1{background:repeating-linear-gradient(90deg,transparent 0 120px,rgba(190,200,215,.16) 160px 260px,transparent 300px 420px);animation:wFog 14s linear infinite}
#weather.fog .w2{background:repeating-linear-gradient(90deg,transparent 0 200px,rgba(170,180,200,.12) 260px 380px,transparent 420px 560px);animation:wFog2 22s linear infinite}
@keyframes wFog{from{background-position:0 0}to{background-position:420px 0}}
@keyframes wFog2{from{background-position:0 0}to{background-position:560px 0}}
#wflash{position:absolute;inset:0;background:#e8f0ff;opacity:0;transition:opacity .09s}
/* Combo banner */
#combo{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:30;font-size:24px;font-weight:bold;color:#ffd24a;text-shadow:0 0 14px #000,0 2px 3px #000;pointer-events:none;opacity:0;white-space:nowrap}
#combo.show{animation:cbo 1.1s ease forwards}
@keyframes cbo{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
/* Achievements */
.achlist{display:flex;flex-direction:column;gap:6px;max-width:340px;width:100%;max-height:52vh;overflow-y:auto;margin-bottom:10px;padding:0 2px}
.ach{display:flex;gap:10px;align-items:center;background:#15152a;border:2px solid #3a3a5a;border-radius:10px;padding:8px 10px;text-align:left}
.ach.locked{opacity:.45}
.ach.rare{border-color:#3a6a9a}
.ach.legendary{border-color:#b7950b}
.ach .ic{font-size:22px;flex:0 0 auto}
.ach b{font-size:13px}
.ach small{display:block;color:#aab;font-size:11px}
/* overlays */
.overlay{position:fixed;inset:0;background:rgba(5,5,15,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;padding:18px;text-align:center;overflow-y:auto}
.overlay h1{font-size:26px;color:#8f8;text-shadow:0 0 12px #4a4;margin-bottom:8px;letter-spacing:2px}
.overlay h2{font-size:20px;color:#f88;margin-bottom:8px}
.overlay p{color:#aab;font-size:13px;line-height:1.5;max-width:340px;margin-bottom:14px}
.btn{display:block;width:280px;margin:8px auto;padding:14px;font-family:inherit;font-size:17px;font-weight:bold;color:#fff;background:#2a4a2a;border:3px solid #4a8a4a;border-radius:12px;cursor:pointer;touch-action:manipulation}
.btn:active{transform:scale(.96)}
.btn.alt{background:#3a3a5a;border-color:#6a6a9a}
.btn:disabled{opacity:.4}
.classbtn{width:300px;text-align:left;padding:12px 14px;font-size:15px}
.classbtn small{display:block;font-weight:normal;color:#cbd;font-size:12px;margin-top:3px}
.uprow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:400px}
.upbtn{width:170px;padding:10px 8px;font-family:inherit;font-size:13px;color:#fff;background:#2a2a4a;border:2px solid #5a5a9a;border-radius:10px;cursor:pointer;touch-action:manipulation}
.upbtn:active{transform:scale(.95)}
.upbtn:disabled{opacity:.35}
.upbtn b{display:block;font-size:14px;margin-bottom:2px}
.upbtn .cost{color:#ffd24a}
.float{position:absolute;font-weight:bold;font-size:16px;pointer-events:none;z-index:40;text-shadow:0 2px 3px #000;animation:fup .8s forwards}
@keyframes fup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-46px)}}
#toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);background:#222a;border:1px solid #557;padding:6px 14px;border-radius:10px;font-size:13px;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.shake{animation:shk .3s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hpwrap"><div id="hpbar"><div id="hpfill"></div></div></div>
    <div class="stat heroStat"><span id="uhero">&#129448;</span>Lv<b id="ulvl">1</b><div id="xpbar"><i id="xpfill"></i></div></div>
    <div class="stat">&#11088; <b id="uscore">0</b></div>
    <div class="stat">&#128176; <b id="ugold">0</b></div>
    <div class="stat"><span id="uweather"></span>W<b id="uwave">1</b></div>
  </div>
  <div id="field"><div id="weather"><div class="wl w1"></div><div class="wl w2"></div><div id="wflash"></div></div><div id="combo"></div></div>
  <div id="gridwrap"><div id="grid"></div></div>
</div>
<div id="toast"></div>

<div class="overlay" id="ovTitle">
  <h1>RJL'S ZOMBIE<br>HERO MATCH</h1>
  <p>Your hero holds the barricade on the left - every match powers their attacks. 5 classes, 100+ waves, a boss every 10th. Kills and waves earn XP: level up to unlock abilities.</p>
  <button class="btn classbtn" id="btnSoldier">&#128737; SOLDIER<small>+30% all damage, fire hits 2.2x. Lv2: Crit Burst. Lv4: Shockwave slam (tap button).</small></button>
  <button class="btn classbtn" id="btnMage">&#129497; MAGE<small>Every match splashes the lane. Lv2: Chain Nova. Lv4: Deep Freeze (tap button).</small></button>
  <button class="btn classbtn" id="btnRanger">&#129693; RANGER<small>+15% damage, fast tracer hits. Lv2: Volley. Lv4: Arrow Storm (tap button).</small></button>
  <button class="btn classbtn" id="btnCleric">&#128519; CLERIC<small>+10% damage, nature heals 2x. Lv2: Blessing. Lv4: Smite (tap button).</small></button>
  <button class="btn classbtn" id="btnNecro">&#129499; NECRO<small>+20% damage, arcane 1.3x. Lv2: Soul Harvest. Lv4: Death Wave (tap button).</small></button>
  <button class="btn alt" id="btnAch">&#127942; ACHIEVEMENTS</button>
  <button class="btn alt" id="btnContinue" style="display:none">CONTINUE</button>
  <div id="titleBoard"></div>
</div>

<div class="overlay" id="ovUpgrade" style="display:none">
  <h1 style="color:#ffd24a;text-shadow:0 0 12px #a80">WAVE CLEARED</h1>
  <p id="upInfo"></p>
  <div class="uprow" id="upRow"></div>
  <button class="btn" id="btnNext">NEXT WAVE &#9654;</button>
</div>

<div class="overlay" id="ovOver" style="display:none">
  <h2>THE HORDE BROKE THROUGH</h2>
  <p id="overInfo"></p>
  <button class="btn alt" id="btnAch2">&#127942; ACHIEVEMENTS</button>
  <button class="btn" id="btnRestart">REBUILD &amp; FIGHT AGAIN</button>
</div>

<div class="overlay" id="ovAch" style="display:none">
  <h1 style="color:#ffd24a;text-shadow:0 0 12px #a80">ACHIEVEMENTS</h1>
  <p id="achCount"></p>
  <div id="achList" class="achlist"></div>
  <button class="btn alt" id="btnAchClose">BACK</button>
</div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ---------- AUDIO (WebAudio blips, style reused from zombietoss repo) ----------
let AC;
function ai(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tn(f,d,t,v){try{ai();if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f,AC.currentTime);g.gain.setValueAtTime(v||.1,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function ns(d,v){try{ai();if(!AC)return;const n=AC.sampleRate*d,s=AC.createBuffer(1,n,AC.sampleRate),ch=s.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const src=AC.createBufferSource();src.buffer=s;const g=AC.createGain();g.gain.setValueAtTime(v||.06,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);src.connect(g);g.connect(AC.destination);src.start()}catch(e){}}
const sfx={
  match:()=>{tn(440,.07,'square',.07);setTimeout(()=>tn(660,.08,'square',.07),60)},
  cascade:()=>{tn(660,.06,'square',.07);setTimeout(()=>tn(880,.09,'square',.07),60)},
  kill:()=>{tn(180,.12,'square',.09);tn(90,.08,'sawtooth',.06);ns(.06,.1)},
  hurt:()=>{tn(120,.18,'sawtooth',.1);ns(.12,.08)},
  wave:()=>{tn(523,.08,'sine',.09);setTimeout(()=>tn(659,.08,'sine',.09),80);setTimeout(()=>tn(784,.12,'sine',.09),160)},
  buy:()=>{tn(880,.05,'square',.06);setTimeout(()=>tn(1174,.07,'square',.06),60)},
  over:()=>{tn(440,.12,'square',.07);setTimeout(()=>tn(330,.15,'square',.06),150);setTimeout(()=>tn(220,.2,'square',.07),300);setTimeout(()=>tn(110,.5,'sawtooth',.06),500)},
  bad:()=>{tn(160,.1,'square',.05)},
  combo:()=>{tn(523,.08,'square',.08);setTimeout(()=>tn(659,.08,'square',.08),70);setTimeout(()=>tn(784,.1,'square',.08),140);setTimeout(()=>tn(1047,.16,'square',.07),210)}
};

// ---------- COLORS (tiles) ----------
const COLORS=[
 {name:'fire',  emoji:'\u{1F525}', bg:'#c0392b'},
 {name:'ice',   emoji:'\u2744\uFE0F', bg:'#2471a3'},
 {name:'nature',emoji:'\u{1F33F}', bg:'#1e8449'},
 {name:'bolt',  emoji:'\u26A1',     bg:'#b7950b'},
 {name:'arcane',emoji:'\u{1F52E}', bg:'#7d3c98'}
];

// ---------- ZOMBIE TYPES (mechanics reused from zombietoss repo) ----------
const ZTYPES={
 regular:{emoji:'\u{1F9DF}',hp:30,spd:1.0,gold:5,dps:4,armor:0,size:36},
 runner: {emoji:'\u{1F9DF}',hp:20,spd:1.9,gold:8,dps:3,armor:0,size:28},
 armored:{emoji:'\u{1F9DF}',hp:55,spd:0.8,gold:12,dps:6,armor:.35,size:40,cls:'armored'},
 brute:  {emoji:'\u{1F9DF}',hp:170,spd:.55,gold:40,dps:14,armor:.2,size:54,cls:'brute'},
 boss:   {emoji:'\u{1F9DF}',hp:420,spd:.42,gold:150,dps:25,armor:.15,size:74,cls:'boss'}
};
function spawnWeights(w){
 return {regular:Math.max(50,100-w*10),armored:Math.min(40,w*5),runner:Math.min(30,w*3),brute:w>=5?Math.min(20,(w-4)*4):0};
}

// ---------- HERO (levels, abilities, class flavor) ----------
const HEROES={
 soldier:{emoji:'\u{1F9B8}',proj:'\u{1F538}',projDur:130,abil:[
  {lvl:2,id:'critburst',name:'Crit Burst',passive:true,desc:'+15% crit chance, crits deal 4x'},
  {lvl:4,id:'shockwave',name:'Shockwave',cd:18,emoji:'\u{1F4A5}',desc:'Slam: heavy damage + knockback to every zombie'}]},
 mage:{emoji:'\u{1F9D9}',proj:'\u{2728}',projDur:210,abil:[
  {lvl:2,id:'chainnova',name:'Chain Nova',passive:true,desc:'Matches arc to a 2nd zombie for 50%'},
  {lvl:4,id:'freezeall',name:'Deep Freeze',cd:22,emoji:'\u{2744}\u{FE0F}',desc:'Freeze every zombie for 4s'}]},
 ranger:{emoji:'\u{1F9DD}',proj:'\u{27B9}',projDur:120,abil:[
  {lvl:2,id:'volley',name:'Volley',passive:true,desc:'Every match also hits a random zombie for 40%'},
  {lvl:4,id:'arrowstorm',name:'Arrow Storm',cd:20,emoji:'\u{1F3F9}',desc:'5 arrows strike random zombies for heavy damage'}]},
 cleric:{emoji:'\u{1F607}',proj:'\u{1F4AB}',projDur:180,abil:[
  {lvl:2,id:'blessing',name:'Blessing',passive:true,desc:'Every match heals the barricade'},
  {lvl:4,id:'smite',name:'Smite',cd:25,emoji:'\u{2728}',desc:'Holy blast: heavy damage to the front 3, wall healed'}]},
 necro:{emoji:'\u{1F9DB}',proj:'\u{2620}\u{FE0F}',projDur:190,abil:[
  {lvl:2,id:'soulharvest',name:'Soul Harvest',passive:true,desc:'Kills grant +50% XP'},
  {lvl:4,id:'deathwave',name:'Death Wave',cd:24,emoji:'\u{1F480}',desc:'Damage every zombie, grows with your kill count'}]}
};
const XPVAL={regular:10,runner:14,armored:20,brute:60,boss:200};
function heroDef(){return HEROES[S.classId]||HEROES.soldier}
function xpNeed(l){return 50+40*l}
function heroUnlocked(){return heroDef().abil.filter(a=>S.heroLvl>=a.lvl)}
function activeAbility(){return heroDef().abil.find(a=>!a.passive&&S.heroLvl>=a.lvl)||null}
function hasPassive(id){return heroUnlocked().some(a=>a.id===id)}
function gainXP(n){
 if(!S||S.over)return;
 S.heroXP+=n;
 let leveled=false;
 while(S.heroXP>=xpNeed(S.heroLvl)){S.heroXP-=xpNeed(S.heroLvl);S.heroLvl++;leveled=true}
 if(leveled){onLevelUp();checkAch()}
 updateHeroHud();saveGame();
}
function onLevelUp(){
 const h=$('hero');
 if(h){h.classList.remove('lvlup');void h.offsetWidth;h.classList.add('lvlup');setTimeout(()=>h.classList.remove('lvlup'),950)}
 sfx.wave();
 toast('LEVEL UP! Hero is Lv'+S.heroLvl);
 heroDef().abil.filter(a=>a.lvl===S.heroLvl).forEach(a=>{
  setTimeout(()=>toast('Unlocked: '+a.name+(a.passive?' (passive)':' - tap the button!')),1000);
 });
 renderAbilityBtn();
}
function updateHeroHud(){
 if(!S)return;
 $('ulvl').textContent=S.heroLvl;
 $('xpfill').style.width=clamp(100*S.heroXP/xpNeed(S.heroLvl),0,100)+'%';
 $('uhero').textContent=heroDef().emoji;
 const h=$('hero');if(h)h.textContent=heroDef().emoji;
}
function renderAbilityBtn(){
 const b=$('abBtn');const ab=S?activeAbility():null;
 if(!ab||S.screen!=='game'){b.style.display='none';return}
 b.style.display='flex';
 updateAbilityBtn();
}
function updateAbilityBtn(){
 const b=$('abBtn');const ab=activeAbility();if(!ab)return;
 if(S.abCD>0){b.classList.add('cd');b.innerHTML=ab.emoji+'<small>'+Math.ceil(S.abCD)+'s</small>'}
 else{b.classList.remove('cd');b.innerHTML=ab.emoji+'<small>READY</small>'}
}
function castAbility(){
 const ab=activeAbility();
 if(!ab||!S||S.over||S.screen!=='game'||S.abCD>0)return;
 S.abCD=ab.cd;
 heroAtkAnim();
 if(ab.id==='shockwave'){
  sfx.kill();ns(.25,.12);
  ringVisual('#ffd24a');
  S.zombies.forEach(z=>{
   if(!z.alive)return;
   dealDamage(z,30+15*S.heroLvl,'fire',false);
   if(z.alive){z.x=clamp(z.x+0.15,0,1.05);updateZombieEl(z)}
  });
 }else if(ab.id==='freezeall'){
  sfx.cascade();
  freezeVisual();
  S.zombies.forEach(z=>{if(z.alive){z.frozenT=4;updateZombieEl(z)}});
 }else if(ab.id==='arrowstorm'){
  sfx.cascade();
  for(let i=0;i<5;i++){
   setTimeout(()=>{
    if(!S||S.over)return;
    const alive=S.zombies.filter(z=>z.alive);if(!alive.length)return;
    const t=alive[Math.floor(rand(0,alive.length))];

// ---------- GRID ----------
function newTile(r,c){return{r:r,c:c,color:Math.floor(rand(0,COLORS.length)),el:null}}
function buildGrid(){
 S.grid=[];
 for(let r=0;r<G;r++){S.grid.push([]);for(let c=0;c<G;c++)S.grid[r].push(newTile(r,c))}
 // avoid starting matches
 let guard=0;
 while(findMatches().length&&guard++<50){
  findMatches().forEach(gp=>gp.cells.forEach(cell=>{S.grid[cell.r][cell.c].color=Math.floor(rand(0,COLORS.length))}));
 }
 if(!hasMove())buildGrid();
}
function tilePos(t){return{x:t.c*CS+2,y:t.r*CS+2}}
function renderTile(t){
 if(!t.el){
  t.el=document.createElement('div');t.el.className='tile';
  $('grid').appendChild(t.el);
 }
 // keep the DOM node in sync with the model - tap handlers read these
 t.el.dataset.r=t.r;t.el.dataset.c=t.c;
 const p=tilePos(t);
 t.el.style.width=(CS-4)+'px';t.el.style.height=(CS-4)+'px';
 t.el.style.transform='translate('+p.x+'px,'+p.y+'px)';
 t.el.style.background=COLORS[t.color].bg;
 t.el.style.fontSize=Math.round(CS*0.52)+'px';
 t.el.textContent=COLORS[t.color].emoji;
}
function renderAllTiles(){if(!S||!S.grid.length)return;S.grid.forEach(row=>row.forEach(renderTile))}

function findMatches(){
 const groups=[],g=S.grid;
 for(let r=0;r<G;r++){let run=1;for(let c=1;c<=G;c++){
  if(c<G&&g[r][c].color===g[r][c-1].color){run++}else{if(run>=3){const cells=[];for(let k=c-run;k<c;k++)cells.push({r:r,c:k});groups.push({color:g[r][c-1].color,cells:cells})}run=1}}}
 for(let c=0;c<G;c++){let run=1;for(let r=1;r<=G;r++){
  if(r<G&&g[r][c].color===g[r-1][c].color){run++}else{if(run>=3){const cells=[];for(let k=r-run;k<r;k++)cells.push({r:k,c:c});groups.push({color:g[r-1][c].color,cells:cells})}run=1}}}
 return groups;
}
function wouldMatch(r1,c1,r2,c2){
 const g=S.grid;
 let tmp=g[r1][c1].color;g[r1][c1].color=g[r2][c2].color;g[r2][c2].color=tmp;
 const m=findMatches().length>0;
 tmp=g[r1][c1].color;g[r1][c1].color=g[r2][c2].color;g[r2][c2].color=tmp;
 return m;
}
function hasMove(){
 for(let r=0;r<G;r++)for(let c=0;c<G;c++){
  if(c<G-1&&wouldMatch(r,c,r,c+1))return true;
  if(r<G-1&&wouldMatch(r,c,r+1,c))return true;
 }
 return false;
}
const delay=ms=>new Promise(res=>setTimeout(res,ms));

async function doSwap(a,b){
 if(S.busy||S.over)return;
 if(Math.abs(a.r-b.r)+Math.abs(a.c-b.c)!==1)return;
 S.busy=true;
 const t1=S.grid[a.r][a.c],t2=S.grid[b.r][b.c];
 S.grid[a.r][a.c]=t2;S.grid[b.r][b.c]=t1;
 t1.r=b.r;t1.c=b.c;t2.r=a.r;t2.c=a.c;
 renderTile(t1);renderTile(t2);
 await delay(200);
 if(!findMatches().length){ // no match: snap back
  S.grid[a.r][a.c]=t1;S.grid[b.r][b.c]=t2;
  t1.r=a.r;t1.c=a.c;t2.r=b.r;t2.c=b.c;
  renderTile(t1);renderTile(t2);
  if(t1.el)t1.el.classList.add('noswap');if(t2.el)t2.el.classList.add('noswap');
  setTimeout(()=>{if(t1.el)t1.el.classList.remove('noswap');if(t2.el)t2.el.classList.remove('noswap')},280);
  sfx.bad();
  await delay(200);S.busy=false;return;
 }
 S.chain=0;
 await resolveBoard();
 if(!hasMove()){shuffleGrid()}
 S.busy=false;
}
function shuffleGrid(){
 const colors=[];S.grid.forEach(row=>row.forEach(t=>colors.push(t.color)));
 let guard=0;
 do{
  for(let i=colors.length-1;i>0;i--){const j=Math.floor(rand(0,i+1));const x=colors[i];colors[i]=colors[j];colors[j]=x}
  let k=0;S.grid.forEach(row=>row.forEach(t=>{t.color=colors[k++]}));
 }while((findMatches().length||!hasMove())&&guard++<80);
 renderAllTiles();toast('Shuffled!');
}
async function resolveBoard(){
 let groups=findMatches();
 while(groups.length){
  S.chain++;
  if(S.chain>1)sfx.cascade();else sfx.match();
  groups.forEach(gp=>gp.cells.forEach(cell=>{const t=S.grid[cell.r][cell.c];if(t.el)t.el.classList.add('pop')}));
  const cm=comboReward(groups,S.chain);attack(groups,S.chain,cm);
  await delay(200);
  // remove popped
  const removed=new Set();
  groups.forEach(gp=>gp.cells.forEach(cell=>removed.add(cell.r+','+cell.c)));
  removed.forEach(key=>{
   const rc=key.split(','),t=S.grid[+rc[0]][+rc[1]];
   if(t.el){t.el.remove()}
  });
  // collapse columns
  for(let c=0;c<G;c++){
   let write=G-1;
   for(let r=G-1;r>=0;r--){
    const t=S.grid[r][c];
    if(!removed.has(r+','+c)){
     if(write!==r){S.grid[write][c]=t;t.r=write;t.c=c}
     write--;
    }
   }
   for(let r=write;r>=0;r--){S.grid[r][c]=newTile(r,c)}
  }
  renderAllTiles();
  await delay(200);
  groups=findMatches();
 }
 S.chain=0;
}

// ---------- INPUT (real-iOS safe: tap-tap or swipe, no double-fire) ----------
// Buttons: touchend + click with a suppression window. Touchend fires first on
// real iOS and preventDefault kills the ghost click; the window covers the rest.
function bindTap(el,fn){
 let last=0;
 const h=e=>{const n=Date.now();if(n-last<500)return;last=n;fn(e)};
 el.addEventListener('touchend',e=>{e.preventDefault();h(e)},{passive:false});
 el.addEventListener('click',h);
}
let touchStart=null,lastTouchEv=0;
function gridPress(x,y,el){
 const t=el&&el.closest?el.closest('.tile'):null;if(!t||!S||S.busy)return;
 touchStart={r:+t.dataset.r,c:+t.dataset.c,x:x,y:y};
}
function gridRelease(x,y){
 if(!touchStart)return;
 const st=touchStart;touchStart=null;
 if(!S||S.busy||!S.grid.length)return;
 const dx=x-st.x,dy=y-st.y;
 const a={r:st.r,c:st.c};
 if(a.r<0||a.r>=G||a.c<0||a.c>=G)return;
 if(Math.abs(dx)>24||Math.abs(dy)>24){ // swipe
  const b={r:a.r,c:a.c};
  if(Math.abs(dx)>Math.abs(dy))b.c+=dx>0?1:-1;else b.r+=dy>0?1:-1;
  clearSel();
  if(b.r>=0&&b.r<G&&b.c>=0&&b.c<G)doSwap(a,b);
 }else{ // tap
  if(S.sel&&S.sel.r===a.r&&S.sel.c===a.c){clearSel()}
  else if(S.sel&&Math.abs(S.sel.r-a.r)+Math.abs(S.sel.c-a.c)===1){const s=S.sel;clearSel();doSwap(s,a)}
  else{clearSel();S.sel=a;const t=S.grid[a.r][a.c];if(t&&t.el)t.el.classList.add('sel')}
 }
}
const gridEl=$('grid');
gridEl.addEventListener('touchstart',e=>{lastTouchEv=Date.now();e.preventDefault();const t=e.changedTouches[0];gridPress(t.clientX,t.clientY,e.target)},{passive:false});
gridEl.addEventListener('touchend',e=>{lastTouchEv=Date.now();e.preventDefault();const t=e.changedTouches[0];gridRelease(t.clientX,t.clientY)},{passive:false});
gridEl.addEventListener('touchcancel',()=>{touchStart=null});
gridEl.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||Date.now()-lastTouchEv<700)return;gridPress(e.clientX,e.clientY,e.target)});
gridEl.addEventListener('pointerup',e=>{if(e.pointerType==='touch'||Date.now()-lastTouchEv<700)return;gridRelease(e.clientX,e.clientY)});
gridEl.addEventListener('pointercancel',()=>{touchStart=null});
function clearSel(){if(S&&S.sel){const t=S.grid[S.sel.r][S.sel.c];if(t&&t.el)t.el.classList.remove('sel')}if(S)S.sel=null}

let comboT=null;
function comboBanner(txt){
 const el=$('combo');if(!el)return;
 el.textContent=txt;
 el.classList.remove('show');void el.offsetWidth;el.classList.add('show');
 clearTimeout(comboT);comboT=setTimeout(()=>el.classList.remove('show'),1150);
}
const MULTINAMES=['','','DOUBLE','TRIPLE','QUAD','QUINT'];
function comboReward(groups,chain){
 // returns the multi-line damage multiplier for this resolve step
 const maxSize=groups.reduce((m,g)=>Math.max(m,g.cells.length),0);
 const multi=groups.length>=2?groups.length:0;
 if(multi)META.stats.multiMatches++;
 if(maxSize>=5)META.stats.combos5++;
 else if(maxSize>=4)META.stats.combos4++;
 if(chain>META.stats.bestChain)META.stats.bestChain=chain;
 let label=null;
 if(maxSize>=5)label='5-IN-A-ROW';
 else if(maxSize>=4)label='4-IN-A-ROW';
 const multiMult=multi?1+0.5*(multi-1):1;
 let pts=0;
 if(maxSize>=5)pts+=500;else if(maxSize>=4)pts+=250;
 if(multi)pts+=200*multi;
 if(pts){S.score+=pts;$('uscore').textContent=S.score}
 const ml=multi?(MULTINAMES[Math.min(multi,5)]||'MEGA')+' MATCH':null;
 if(label&&ml)comboBanner(label+' + '+ml+'! x'+(multiMult).toFixed(1));
 else if(label)comboBanner(label+'!');
 else if(ml)comboBanner(ml+'! x'+multiMult.toFixed(1));
 if(label||ml){sfx.combo();metaSave();checkAch()}
 return multiMult;
}

function attack(groups,chain,comboMult){
 const zs=S.zombies.filter(z=>z.alive);
 if(!zs.length)return;
 const hd=heroDef();
 groups.forEach(gp=>{
  const cn=COLORS[gp.color].name;
  const size=gp.cells.length;
  let dmg=size*8*(1+0.2*S.up.dmg)*(1+0.5*(chain-1))*(comboMult||1);
  if(size===4)dmg*=1.5;if(size>=5)dmg*=2;
  dmg*=classDmgMult();
  // target: frontmost zombie
  const target=zs.reduce((a,b)=>!a||b.x>a.x?b:a,null);
  if(!target)return;
  if(cn==='fire')dmg*=S.classId==='soldier'?2.2:1.6;
  if(cn==='arcane'&&S.classId==='necro')dmg*=1.3;
  // the hero delivers the hit: swing + projectile from hero to target
  heroAtkAnim();
  spawnProj(heroPos(),zPos(target),hd.proj,hd.projDur);
  if(cn==='bolt'&&S.weather==='storm'){dmg*=1.5;S._stormBolt=true}
  let crit=false;
  let critCh=(S.classId==='soldier'&&S.up.perk>0)?0.1*S.up.perk:0;
  if(hasPassive('critburst'))critCh+=0.15;
  if(S.classId==='soldier'&&critCh>0&&Math.random()<critCh){dmg*=hasPassive('critburst')?4:3;crit=true}
  dealDamage(target,dmg,cn,crit);
  if(cn==='ice'){const dur=(S.classId==='mage'?3+S.up.perk:2)*(S.weather==='snow'?1.5:1);zs.filter(z=>z.lane===target.lane).forEach(z=>z.slowT=Math.max(z.slowT,dur))}
  if(cn==='nature')healBarricade(size*2*(S.classId==='cleric'?2:1)*(S.weather==='rain'?1.5:1));
  if(cn==='bolt'){const others=zs.filter(z=>z!==target).sort((a,b)=>b.x-a.x).slice(0,2);others.forEach(z=>dealDamage(z,dmg*0.5,cn,false))}
  if(S.classId==='mage'){
   const spl=0.6+0.1*S.up.perk;
   zs.filter(z=>z!==target&&z.lane===target.lane).forEach(z=>dealDamage(z,dmg*spl,cn,false));
  }
  if(hasPassive('chainnova')){
   const nxt=zs.filter(z=>z!==target&&z.alive).sort((a,b)=>b.x-a.x)[0];
   if(nxt){spawnProj(zPos(target),zPos(nxt),'\u{26A1}',140);dealDamage(nxt,dmg*0.5,'arcane',false)}
  }
  if(hasPassive('volley')){
   const oth=zs.filter(z=>z!==target&&z.alive);
   if(oth.length){const v=oth[Math.floor(rand(0,oth.length))];spawnProj(heroPos(),zPos(v),'\u{27B9}',120);dealDamage(v,dmg*0.4,'bolt',false)}
  }
  if(hasPassive('blessing'))healBarricade(size);
 });
}
function dealDamage(z,dmg,cn,crit){
 if(!z.alive)return;
 let d=dmg;
 if(cn==='arcane'){if(z.type==='brute')d*=1.5}
 else d*= (1-z.armor);
 d=Math.max(1,Math.round(d));
 z.hp-=d;
 floatText(z,d+(crit?'!':''),crit?'#ffd24a':'#fff');
 updateZombieEl(z);
 if(z.hp<=0)killZombie(z);else sfxQuiet();
}
let lastHitSfx=0;
function sfxQuiet(){const n=performance.now();if(n-lastHitSfx>120){lastHitSfx=n;tn(300,.05,'square',.04)}}
const ZPOINTS={regular:100,runner:150,armored:200,brute:1000,boss:5000};
function killZombie(z){
 z.alive=false;
 S.score+=ZPOINTS[z.type]||100;S.kills++;
 META.stats.totalKills++;if(z.type==='boss')META.stats.bossKills++;metaSave();checkAch();
 $('uscore').textContent=S.score;
 const g=Math.round(ZTYPES[z.type].gold*(1+0.25*S.up.greed));
 S.gold+=g;$('ugold').textContent=S.gold;
 floatText(z,'+'+g+'\u{1F4B0}','#ffd24a');
 z.el.classList.add('dying');
 sfx.kill();
 gainXP(Math.round((XPVAL[z.type]||10)*(hasPassive('soulharvest')?1.5:1)));
 setTimeout(()=>{if(z.el)z.el.remove()},380);
 setTimeout(saveGame,0);
}
function healBarricade(n){S.hp=clamp(S.hp+n,0,S.maxHp);updateHud()}

function floatText(z,txt,color){
 const f=$('field');const el=document.createElement('div');
 el.className='float';el.textContent=txt;el.style.color=color;
 el.style.left=(z.x*(f.clientWidth-40)+10)+'px';
 el.style.top=(z.lane*LH+4)+'px';
 f.appendChild(el);setTimeout(()=>el.remove(),820);
}

// ---------- ZOMBIES ----------
function spawnZombie(forceType){
 const w=S.wave;
 let type=forceType;
 if(!type){
  const ws=spawnWeights(w);const total=Object.values(ws).reduce((a,b)=>a+b,0);
  let r=Math.random()*total;
  for(const k in ws){r-=ws[k];if(r<=0){type=k;break}}
  type=type||'regular';
 }
 const cfg=ZTYPES[type];
 const hpScale=1+0.22*(w-1),spdScale=Math.min(1.6,1+0.04*(w-1));
 const z={id:++S.zid,type:type,lane:Math.floor(rand(0,LANES)),x:1.08,
  hp:Math.round(cfg.hp*hpScale),maxHp:Math.round(cfg.hp*hpScale),
  spd:cfg.spd*spdScale*rand(0.9,1.1),armor:cfg.armor,gold:cfg.gold,
  dps:Math.round(cfg.dps*(1+0.1*(w-1))),slowT:0,frozenT:0,attackT:0,alive:true,size:cfg.size,el:null};
 const el=document.createElement('div');
 el.className='zombie'+(cfg.cls?' '+cfg.cls:'');
 el.innerHTML='<span class="zem" style="font-size:'+cfg.size+'px">'+cfg.emoji+'</span><div class="zhp" style="width:'+(cfg.size+6)+'px"><i style="width:100%"></i></div>';
 $('field').appendChild(el);
 z.el=el;
 S.zombies.push(z);
}
function updateZombieEl(z){
 if(!z.el)return;
 const fw=$('field').clientWidth-40;
 const y=z.lane*LH+Math.max(0,LH-(z.size||36)-14);
 z.el.style.transform='translate('+(10+z.x*fw)+'px,'+y+'px)';
 const bar=z.el.querySelector('.zhp i');
 if(bar)bar.style.width=clamp(100*z.hp/z.maxHp,0,100)+'%';
 z.el.classList.toggle('slow',z.slowT>0||z.frozenT>0);
}
let lastT=0;
function loop(t){
 requestAnimationFrame(loop);
 if(!S||S.screen!=='game'||S.over)return;
 const dt=Math.min(0.05,(t-lastT)/1000||0);lastT=t;
 // ability cooldown
 if(S.abCD>0){const before=Math.ceil(S.abCD);S.abCD=Math.max(0,S.abCD-dt);if(Math.ceil(S.abCD)!==before)updateAbilityBtn()}
 // spawning
 if(S.spawnQueue>0){
  S.spawnT-=dt;
  if(S.spawnT<=0){
   if(S.bossPending){spawnZombie('boss');S.bossPending=false}else{spawnZombie()}
   S.spawnQueue--;S.spawnT=S.spawnInt*rand(0.7,1.3);
  }
 }
 // move
 let reached=false;
 S.zombies.forEach(z=>{
  if(!z.alive)return;
  if(z.frozenT>0){z.frozenT-=dt;updateZombieEl(z);return}
  const slowMult=z.slowT>0?0.5:1;
  if(z.slowT>0)z.slowT-=dt;
  z.x-=z.spd*slowMult*(S.weather==='fog'?0.9:1)*dt*0.045;
  if(z.x<=0.01){
   z.x=0.01;
   z.attackT+=dt;
   if(z.attackT>=1){z.attackT=0;S.hp-=z.dps;reached=true;floatText(z,'-'+z.dps,'#f66')}
  }
  updateZombieEl(z);
 });
 if(reached){
  $('app').classList.remove('shake');void $('app').offsetWidth;$('app').classList.add('shake');
  sfx.hurt();updateHud();
  if(S.hp<=0){gameOver();return}
 }
 // cleanup dead refs
 S.zombies=S.zombies.filter(z=>z.alive||z.el&&z.el.parentNode);
 // wave end
 if(S.spawnQueue===0&&!S.zombies.some(z=>z.alive)){
  waveComplete();
 }
}
requestAnimationFrame(loop);

// ---------- WAVES ----------
function startWave(n,keepWeather){
 S.wave=n;S.over=false;
 if(!keepWeather)S.weather=rollWeather();applyWeather();META.stats.bestWave=Math.max(META.stats.bestWave,n);metaSave();checkAch();
 const isBoss=n%10===0;
 S.spawnQueue=isBoss?Math.max(3,Math.ceil((4+2*n)/2)):4+2*n+(n%5===0?2:0);
 S.bossPending=isBoss;
 S.spawnInt=Math.max(0.7,2.1-0.1*n);
 S.spawnT=0.5;
 S.hp=clamp(S.hp,1,S.maxHp);
 S.screen='game';
 $('ovUpgrade').style.display='none';$('ovOver').style.display='none';$('ovTitle').style.display='none';
 updateHud();updateHeroHud();renderAbilityBtn();sfx.wave();if(isBoss)toast('BOSS WAVE '+n+'!');const wdef=WEATHERS[S.weather];if(wdef&&wdef.desc)setTimeout(()=>toast(wdef.icon+' '+wdef.name+': '+wdef.desc),isBoss?1600:250);saveGame();
}
function waveComplete(){
 if(S.over)return;
 S.screen='upgrade';
 if(S.hp<10){META.stats.closeCall=1;metaSave()}
 checkAch();
 $('abBtn').style.display='none';
 S.zombies.forEach(z=>{if(z.el)z.el.remove()});
 S.zombies=[];
 const bonus=10+S.wave*5;
 S.gold+=bonus;$('ugold').textContent=S.gold;
 S.score+=S.wave*250;$('uscore').textContent=S.score;
 gainXP(25+15*S.wave);
 saveGame();
 $('upInfo').innerHTML='Wave '+S.wave+' cleared! Bonus +'+bonus+' gold. Barricade '+Math.max(0,Math.round(S.hp))+'/'+S.maxHp+' HP. Hero Lv'+S.heroLvl+'.';
 renderUpgrades();
 $('ovUpgrade').style.display='flex';
 saveGame();
}
function gameOver(){
 S.over=true;S.screen='over';
 $('abBtn').style.display='none';
 sfx.over();
 const rank=lbRecord();
 $('overInfo').innerHTML='You fell on wave '+S.wave+' with <b style="color:#ffd24a">'+S.score+'</b> pts ('+S.kills+' kills), hero Lv'+S.heroLvl+' - rank #'+rank+' locally. Class, gold, upgrades, hero level and score carry over.'+lbHtml(10);
 saveGame();
 $('ovOver').style.display='flex';
}

// ---------- UPGRADES ----------
const UPS=[
 {id:'dmg', name:'Sharper Axes', desc:'+20% match damage', cost:l=>Math.floor(20*Math.pow(1.6,l))},
 {id:'vit', name:'Reinforce Wall', desc:'+25 max HP, heal to full', cost:l=>Math.floor(25*Math.pow(1.6,l))},
 {id:'greed',name:'Looting', desc:'+25% gold from kills', cost:l=>Math.floor(15*Math.pow(1.7,l))},
 {id:'perk',name:'', desc:'', cost:l=>Math.floor(30*Math.pow(1.8,l))}
];
function perkInfo(){return S.classId==='soldier'?{name:'Headshot',desc:'+10% chance of 3x crit'}:{name:'Frostbite',desc:'+10% splash, longer slow'}}
function renderUpgrades(){
 const row=$('upRow');row.innerHTML='';
 UPS.forEach(u=>{
  const lvl=S.up[u.id];
  const cost=u.cost(lvl);
  const info=u.id==='perk'?perkInfo():u;
  const b=document.createElement('button');
  b.className='upbtn';
  b.innerHTML='<b>'+info.name+' Lv'+lvl+'</b>'+info.desc+'<br><span class="cost">'+cost+' &#128176;</span>';
  b.disabled=S.gold<cost;
  bindTap(b,()=>{
   if(S.gold<cost)return;
   S.gold-=cost;S.up[u.id]++;
   if(u.id==='vit'){S.maxHp+=25;S.hp=S.maxHp}
   sfx.buy();saveGame();updateHud();renderUpgrades();
   $('upInfo').innerHTML='Gold: '+S.gold+' &#128176; - Hero Lv'+S.heroLvl+' ('+S.heroXP+'/'+xpNeed(S.heroLvl)+' XP)';
  });
  row.appendChild(b);
 });
 $('btnNext').textContent='NEXT WAVE '+(S.wave+1)+' \u25B6';
}

// ---------- HUD ----------
function updateHud(){
 $('hpfill').style.width=clamp(100*S.hp/S.maxHp,0,100)+'%';
 $('ugold').textContent=S.gold;
 $('uscore').textContent=S.score;
 $('uwave').textContent=S.wave;
}
let toastT=null;
function toast(msg){const t=$('toast');t.textContent=msg;t.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity=0,1400)}

// ---------- LEADERBOARD (pattern ported from zombietoss systems/leaderboard.js, local-only) ----------
const LB_KEY='zhm_scores';
function lbLoad(){try{return JSON.parse(localStorage.getItem(LB_KEY)||'[]')}catch(e){return[]}}
function lbSave(list){try{localStorage.setItem(LB_KEY,JSON.stringify(list.slice(0,50)))}catch(e){}}
function lbRecord(){
 const list=lbLoad();
 const entry={name:'RJL',score:S.score,wave:S.wave,kills:S.kills,classId:S.classId,timestamp:Date.now()};
 list.push(entry);
 list.sort((a,b)=>b.score-a.score);
 lbSave(list);
 return list.indexOf(entry)+1;
}
function lbTop(n){return lbLoad().slice(0,n||10)}
function lbHtml(n){
 const top=lbTop(n);
 if(!top.length)return '';
 let h='<div style="margin:10px auto;max-width:320px;text-align:left;font-size:13px;background:#15152a;border:2px solid #3a3a5a;border-radius:10px;padding:8px 12px"><b style="color:#ffd24a">LOCAL HEROES</b><br>';
 top.forEach((e,i)=>{
  h+='<div style="display:flex;justify-content:space-between;gap:14px;padding:2px 0;white-space:nowrap"><span>'+(i+1)+'. '+e.name+' <span style="color:#889">('+(e.classId||'?').slice(0,3).toUpperCase()+' W'+e.wave+')</span></span><b>'+e.score+'</b></div>';
 });
 return h+'</div>';
}

// ---------- FLOW ----------
function newGame(classId){
 S=freshState(classId);
 if(META.stats.classes.indexOf(classId)<0){META.stats.classes.push(classId);metaSave()}checkAch();
 S.grid=[];document.querySelectorAll('#grid .tile').forEach(e=>e.remove());
 document.querySelectorAll('#field .zombie').forEach(e=>e.remove());
 buildGrid();layout();startWave(1);saveGame();
}
function continueGame(d){
 applySave(d);
 S.grid=[];document.querySelectorAll('#grid .tile').forEach(e=>e.remove());
 document.querySelectorAll('#field .zombie').forEach(e=>e.remove());
 buildGrid();layout();startWave(S.wave,true);
}
bindTap($('btnSoldier'),()=>{try{localStorage.removeItem('zms_save')}catch(e){};newGame('soldier')});
bindTap($('btnMage'),()=>{try{localStorage.removeItem('zms_save')}catch(e){};newGame('mage')});
bindTap($('btnRanger'),()=>{try{localStorage.removeItem('zms_save')}catch(e){};newGame('ranger')});
bindTap($('btnCleric'),()=>{try{localStorage.removeItem('zms_save')}catch(e){};newGame('cleric')});
bindTap($('btnNecro'),()=>{try{localStorage.removeItem('zms_save')}catch(e){};newGame('necro')});
bindTap($('btnContinue'),()=>{const d=loadSave();if(d)continueGame(d)});
bindTap($('btnNext'),()=>startWave(S.wave+1));
bindTap($('btnAch'),()=>{renderAch();$('ovAch').style.display='flex'});
bindTap($('btnAch2'),()=>{renderAch();$('ovAch').style.display='flex'});
bindTap($('btnAchClose'),()=>{$('ovAch').style.display='none'});
bindTap($('btnRestart'),()=>{
 // keep class/gold/upgrades/hero, back to wave 1
 const keep={classId:S.classId,wave:1,gold:S.gold,score:S.score,kills:S.kills,maxHp:S.maxHp,hp:S.maxHp,up:S.up,heroLvl:S.heroLvl,heroXP:S.heroXP};
 try{localStorage.setItem('zms_save',JSON.stringify(keep))}catch(e){}
 continueGame(keep);
});
// boot
(function(){
 ensureHero();metaLoad();
 const d=loadSave();
 if(d){const b=$('btnContinue');b.style.display='block';const cn=(HEROES[d.classId]?d.classId:'soldier');b.textContent='CONTINUE \u2014 WAVE '+d.wave+' ('+cn.charAt(0).toUpperCase()+cn.slice(1)+', Lv'+(d.heroLvl||1)+')'}
 $('titleBoard').innerHTML=lbHtml(5);
})();
// periodic autosave
setInterval(()=>{if(S&&S.screen==='game')saveGame()},5000);

// test hooks
window.__ZT={get S(){return S},newGame:newGame,continueGame:continueGame,loadSave:loadSave,saveGame:saveGame,
 gainXP:gainXP,castAbility:castAbility,activeAbility:activeAbility,heroUnlocked:heroUnlocked,xpNeed:xpNeed,
 gridSnapshot:function(){return S.grid.map(row=>row.map(t=>t.color))},
 tileScreenPos:function(r,c){const g=$('grid').getBoundingClientRect();return{x:g.left+c*CS+CS/2,y:g.top+r*CS+CS/2}},
 findSwap:function(){for(let r=0;r<G;r++)for(let c=0;c<G;c++){if(c<G-1&&wouldMatch(r,c,r,c+1))return[{r:r,c:c},{r:r,c:c+1}];if(r<G-1&&wouldMatch(r,c,r+1,c))return[{r:r,c:c},{r:r+1,c:c}]}return null},
 findInvalidSwap:function(){for(let r=0;r<G;r++)for(let c=0;c<G;c++){if(c<G-1&&!wouldMatch(r,c,r,c+1))return[{r:r,c:c},{r:r,c:c+1}];if(r<G-1&&!wouldMatch(r,c,r+1,c))return[{r:r,c:c},{r:r+1,c:c}]}return null},
 doSwap:doSwap,spawnZombie:spawnZombie,startWave:startWave,waveComplete:waveComplete,
 get META(){return META},checkAch:checkAch,rollWeather:rollWeather,applyWeather:applyWeather,ACH:ACH,WEATHERS:WEATHERS,comboReward:comboReward,renderAch:renderAch};
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
  // a new service worker taking control means fresh assets - reload once onto them
  var zhmswReloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange', function() {
    if (zhmswReloaded) return; zhmswReloaded=true; location.reload();
  });
}
